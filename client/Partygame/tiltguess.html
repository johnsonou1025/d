<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#07090e">
    <title>TiltGuess - 比手畫腳體感猜題</title>

    <!-- 全域整合字型樣式表 -->
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --bg-dark: #07090e;
            --accent-gold: #ffd166;
            --neon-green: #30d158;
            --neon-green-glow: rgba(48, 209, 88, 0.45);
            --neon-red: #ff3366;
            --neon-red-glow: rgba(255, 51, 102, 0.45);
            --neon-blue: #00d2ff;
            --neon-blue-glow: rgba(0, 210, 255, 0.4);
            --card-glass: rgba(18, 22, 34, 0.88);
            --border-glass: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            background: radial-gradient(circle at center, rgba(24, 30, 48, 0.95) 0%, rgba(7, 9, 14, 0.99) 100%);
            color: #ffffff;
            font-family: var(--font-main);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            transition: background 0.25s ease-out;
        }

        /* 答對與跳過的閃爍背景反饋 */
        body.feedback-correct {
            background: radial-gradient(circle at center, rgba(48, 209, 88, 0.45) 0%, rgba(7, 9, 14, 0.98) 100%) !important;
        }

        body.feedback-pass {
            background: radial-gradient(circle at center, rgba(255, 51, 102, 0.45) 0%, rgba(7, 9, 14, 0.98) 100%) !important;
        }

        /* ==========================================================================
           1. 頂部 HUD (In-Game Top Bar)
           ========================================================================== */
        .info-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 64px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 max(env(safe-area-inset-right, 20px), 20px) 0 max(env(safe-area-inset-left, 20px), 20px);
            padding-top: max(env(safe-area-inset-top, 8px), 8px);
            z-index: 20;
            background: linear-gradient(180deg, rgba(7, 9, 14, 0.8) 0%, transparent 100%);
        }

        .btn-hud-home {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
        }

        .btn-hud-home:active {
            transform: scale(0.93);
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-hud-home svg {
            width: 13px;
            height: 13px;
            fill: currentColor;
        }

        .category-pill {
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.18), rgba(0, 119, 182, 0.28));
            border: 1px solid rgba(0, 210, 255, 0.4);
            color: var(--neon-blue);
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 5px 16px;
            border-radius: 999px;
            box-shadow: 0 0 16px var(--neon-blue-glow);
        }

        .hud-stats-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-pill {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-family: var(--font-numeric);
            font-size: 0.85rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: #ffffff;
            padding: 5px 12px;
            border-radius: 999px;
            letter-spacing: 0.8px;
        }

        .info-pill.highlight {
            color: var(--accent-gold);
            border-color: rgba(255, 209, 102, 0.35);
        }

        /* ==========================================================================
           2. 核心題目展示區 (Question Display)
           ========================================================================== */
        #stage-container {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        #question-display {
            font-size: min(15vw, 6.8rem);
            text-align: center;
            width: 90%;
            max-width: 960px;
            color: #ffffff;
            font-family: var(--font-display);
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1.2;
            word-break: keep-all;
            overflow-wrap: break-word;
            paint-order: stroke fill;
            text-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
            z-index: 5;
            transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.15s ease;
        }

        /* 答對反饋文字樣式 */
        .feedback-correct #question-display {
            color: var(--neon-green);
            text-shadow: 0 0 40px var(--neon-green-glow), 0 8px 25px rgba(0, 0, 0, 0.9);
        }

        /* 跳過反饋文字樣式 */
        .feedback-pass #question-display {
            color: var(--neon-red);
            text-shadow: 0 0 40px var(--neon-red-glow), 0 8px 25px rgba(0, 0, 0, 0.9);
        }

        /* 輔助觸控按鈕區 (電腦或平放桌上時可用) */
        .manual-tap-strip {
            position: absolute;
            bottom: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 15;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .manual-tap-strip:hover {
            opacity: 1;
        }

        .btn-manual-action {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 999px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.75rem;
            font-weight: 800;
            padding: 6px 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
        }

        .btn-manual-action.pass {
            border-color: rgba(255, 51, 102, 0.3);
            color: #ff6699;
        }

        .btn-manual-action.correct {
            border-color: rgba(48, 209, 88, 0.3);
            color: #4cd964;
        }

        .btn-manual-action:active {
            transform: scale(0.93);
        }

        /* ==========================================================================
           3. 首頁大廳浮層 (Lobby Overlay)
           ========================================================================== */
        #overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 20%, rgba(26, 32, 50, 0.96) 0%, rgba(7, 9, 14, 0.99) 100%);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(env(safe-area-inset-top, 20px), 20px) 24px max(env(safe-area-inset-bottom, 24px), 24px) 24px;
            overflow-y: auto;
        }

        .lobby-top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-pill-link {
            text-decoration: none;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #ffffff;
            font-size: 0.88rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .nav-pill-link:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.18);
        }

        .lobby-tag-badge {
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 999px;
        }

        .lobby-center-content {
            width: 100%;
            max-width: 580px;
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
        }

        .game-badge-icon {
            width: 68px;
            height: 68px;
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.25) 0%, rgba(48, 209, 88, 0.25) 100%);
            border: 2px solid rgba(0, 210, 255, 0.35);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px var(--neon-blue-glow);
        }

        .game-badge-icon svg {
            width: 36px;
            height: 36px;
            fill: var(--neon-blue);
        }

        .lobby-title {
            font-family: var(--font-display);
            font-size: 2.1rem;
            font-weight: 900;
            letter-spacing: 1px;
            margin: 0;
            background: linear-gradient(180deg, #ffffff 40%, #c7d2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }

        .lobby-subtitle {
            font-size: 0.88rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 4px;
        }

        /* 體感教學指示卡 */
        .tutorial-card {
            width: 100%;
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .tutorial-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.78rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
        }

        .tutorial-icon {
            font-size: 1.3rem;
        }

        .tutorial-divider {
            width: 1px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
        }

        /* 設定區塊 */
        .setting-box {
            width: 100%;
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .setting-header {
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-align: center;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .btn-grid.time-grid {
            grid-template-columns: repeat(6, 1fr);
        }

        @media (max-width: 480px) {
            .btn-grid.time-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .opt-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 10px 4px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.88rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .opt-btn:active {
            transform: scale(0.94);
        }

        .opt-btn.active {
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.25), rgba(0, 119, 182, 0.35));
            border-color: var(--neon-blue);
            color: #ffffff;
            box-shadow: 0 0 16px var(--neon-blue-glow);
        }

        /* 開始按鈕 */
        .btn-start-action {
            width: 100%;
            max-width: 580px;
            margin: 10px auto 0 auto;
            background: linear-gradient(135deg, #00d2ff 0%, #0077b6 100%);
            border: none;
            color: #ffffff;
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 900;
            letter-spacing: 1.2px;
            padding: 16px 24px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 28px var(--neon-blue-glow), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.15s;
        }

        .btn-start-action:active {
            transform: scale(0.97);
            box-shadow: 0 4px 14px var(--neon-blue-glow);
        }

        /* ==========================================================================
           4. 結算畫面浮層 (Game Over Overlay)
           ========================================================================== */
        #gameover-overlay {
            position: fixed;
            inset: 0;
            z-index: 250;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(7, 9, 14, 0.94);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            text-align: center;
        }

        .gameover-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            border-radius: 26px;
            padding: 28px 24px;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .trophy-badge {
            font-size: 3.5rem;
            filter: drop-shadow(0 0 18px rgba(255, 209, 102, 0.5));
            animation: bounce-trophy 1.2s infinite alternate ease-in-out;
        }

        @keyframes bounce-trophy {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-6px);
            }
        }

        .result-title {
            font-size: 1.6rem;
            font-weight: 900;
            color: #ffffff;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .result-subtitle {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin: 0;
        }

        .final-stat-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 18px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .stat-label {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 700;
            text-transform: uppercase;
        }

        .stat-value {
            font-family: var(--font-numeric);
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--neon-green);
            font-variant-numeric: tabular-nums;
        }

        .stat-value.pass-count {
            color: var(--neon-red);
        }

        .gameover-actions {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-rematch {
            width: 100%;
            background: linear-gradient(135deg, #00d2ff 0%, #0077b6 100%);
            border: none;
            color: #ffffff;
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 1px;
            padding: 14px;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 18px var(--neon-blue-glow);
            transition: transform 0.1s;
        }

        .btn-rematch:active {
            transform: scale(0.96);
        }

        .btn-back-lobby {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-size: 0.88rem;
            font-weight: 700;
            padding: 12px;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-back-lobby:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.18);
        }

        /* 處罰展示區樣式 (輸家懲罰) */
        .dare-settlement-box {
            width: 100%;
            background: linear-gradient(145deg, rgba(255, 59, 48, 0.12) 0%, rgba(255, 149, 0, 0.08) 100%);
            border: 1px dashed rgba(255, 69, 58, 0.45);
            border-radius: 18px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(255, 59, 48, 0.12);
        }

        .dare-settlement-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .dare-badge-tag {
            font-size: 0.72rem;
            font-weight: 800;
            color: #ff453a;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .dare-setting-link {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            transition: all 0.15s;
        }

        .dare-setting-link:active {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(0.95);
        }

        .dare-settlement-content {
            font-size: 1.05rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.4;
            text-align: center;
            word-break: break-word;
            padding: 4px 6px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-dare-action {
            width: 100%;
            background: linear-gradient(135deg, rgba(255, 214, 10, 0.18) 0%, rgba(255, 149, 0, 0.25) 100%);
            border: 1px solid rgba(255, 214, 10, 0.5);
            color: #ffd60a;
            font-family: var(--font-display);
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            padding: 13px;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(255, 214, 10, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: transform 0.15s, background 0.15s;
        }

        .btn-dare-action:active {
            transform: scale(0.96);
            background: linear-gradient(135deg, rgba(255, 214, 10, 0.3) 0%, rgba(255, 149, 0, 0.4) 100%);
        }
    </style>
</head>

<body>
    <!-- 頂部資訊 HUD -->
    <div class="info-bar">
        <a href="javascript:void(0)" onclick="quitGame()" class="btn-hud-home">
            <svg viewBox="0 0 24 24">
                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"></path>
            </svg>
            大廳
        </a>

        <div id="category-ui" class="category-pill">TOPIC</div>

        <div class="hud-stats-group">
            <div id="timer-ui" class="info-pill highlight">TIME: 60</div>
            <div id="score-ui" class="info-pill">SCORE: 0</div>
        </div>
    </div>

    <!-- 主展示舞台 -->
    <div id="stage-container">
        <div id="question-display">READY?</div>

        <!-- 輔助手動按鈕 (支援桌上放置或免陀螺儀玩法) -->
        <div class="manual-tap-strip">
            <button class="btn-manual-action pass" onclick="action('pass')">
                <span>跳過 PASS (仰頭)</span>
                <span>⬆️</span>
            </button>
            <button class="btn-manual-action correct" onclick="action('correct')">
                <span>⬇️</span>
                <span>答對 CORRECT (點頭)</span>
            </button>
        </div>
    </div>

    <!-- 首頁大廳浮層 (Lobby Overlay) -->
    <div id="overlay">
        <div class="lobby-top-bar">
            <a href="index.html" class="nav-pill-link">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"></path>
                </svg>
                Party Hub
            </a>
            <div class="lobby-tag-badge">GYRO MOTION</div>
        </div>

        <div class="lobby-center-content">
            <div class="game-badge-icon">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z">
                    </path>
                </svg>
            </div>
            <div>
                <h1 class="lobby-title">TiltGuess</h1>
                <p class="lobby-subtitle">比手畫腳 · 體感仰頭派對猜題</p>
            </div>

            <!-- 體感教學指示 -->
            <div class="tutorial-card">
                <div class="tutorial-item">
                    <span class="tutorial-icon">📱</span>
                    <span>手機橫貼額頭</span>
                </div>
                <div class="tutorial-divider"></div>
                <div class="tutorial-item">
                    <span class="tutorial-icon" style="color: var(--neon-green);">⬇️</span>
                    <span style="color: var(--neon-green);">點頭向下 · 答對</span>
                </div>
                <div class="tutorial-divider"></div>
                <div class="tutorial-item">
                    <span class="tutorial-icon" style="color: var(--neon-red);">⬆️</span>
                    <span style="color: var(--neon-red);">仰頭向上 · 跳過</span>
                </div>
            </div>

            <!-- 步驟一：選擇題庫 -->

    <!-- 結算畫面浮層 (Game Over Overlay) -->

    <script src="dares.js"></script>

            "世界地圖": ["日本", "韓國", "泰國", "新加坡", "越南", "菲律賓", "印度", "馬來西亞", "印度尼西亞", "土耳其", "法國", "英國", "義大利", "德國", "西班牙", "瑞士", "荷蘭", "希臘", "奧地利", "比利時", "葡萄牙", "冰島", "挪威", "瑞典", "丹麥", "美國", "加拿大", "巴西", "墨西哥", "阿根廷", "澳洲", "紐西蘭", "埃及", "南非", "智利", "秘魯", "古巴", "蒙古", "芬蘭", "俄羅斯", "摩納哥", "梵蒂岡", "愛爾蘭", "波蘭", "匈牙利", "捷克", "以色列", "伊朗", "伊拉克", "沙烏地阿拉伯", "肯亞", "衣索比亞", "摩洛哥", "尼泊爾", "不丹", "斯里蘭卡", "烏克蘭", "克羅埃西亞", "巴拿馬", "牙買加"],
            "世界動物": ["大象", "長頸鹿", "獅子", "老虎", "袋鼠", "河馬", "犀牛", "斑馬", "猩猩", "猴子", "無尾熊", "熊貓", "北極熊", "狐狸", "狼", "公雞", "鴨子", "豬", "綿羊", "山羊", "牛", "兔子", "馬", "松鼠", "刺蝟", "企鵝", "鴕鳥", "孔雀", "老鷹", "貓頭鷹", "蝴蝶", "蜜蜂", "蚊子", "螳螂", "蜘蛛", "海豚", "鯊魚", "螃蟹", "章魚", "海龜", "鱷魚", "變色龍", "螢火蟲", "瓢蟲", "蝸牛", "青蛙", "水母", "海馬", "座頭鯨", "海豹", "海獺", "火烈鳥", "黑猩猩", "駱駝", "麋鹿", "蝙蝠", "松鼠猴", "浣熊", "樹懶", "土撥鼠"],
            "世界古蹟": ["萬里長城", "秦始皇兵馬俑", "台北101", "泰姬瑪哈陵", "吳哥窟", "魚尾獅", "大佛", "紫禁城", "耶路撒冷哭牆", "佩特拉古城", "比薩斜塔", "艾菲爾鐵塔", "羅馬競技場", "帕德嫩神廟", "凱旋門", "巨石陣", "聖家堂", "白金漢宮", "紅場", "凡爾賽宮", "聖米歇爾山", "新天鵝堡", "柏林圍牆", "威尼斯運河", "龐貝古城", "自由女神像", "金字塔", "人面獅身像", "馬丘比丘", "摩艾石像", "雪梨歌劇院", "基督像", "總統山", "復活節島", "瑪雅文明", "大本鐘", "白宮", "金門大橋", "巴拿馬大運河", "空中花園", "聖巴西爾大教堂", "倫敦塔橋", "西斯汀小堂", "雅典衛城", "婆羅浮屠", "布達拉宮", "金閣寺", "嚴島神社", "海神廟", "仰光大金塔", "科隆大教堂", "米蘭大教堂", "盧浮宮", "大英博物館", "大都會藝術博物館", "阿爾罕布拉宮", "卡納克神廟", "烏魯魯", "霍夫堡", "美泉宮"]
        };

        const TIME_OPTIONS = [30, 60, 90, 120, 150, 180];

        let selectedCat = "國小生活";
        let selectedTime = 60;
        let currentQuestions = [];
        let score = 0;
        let passCount = 0;
        let timeLeft = 60;
        let isGaming = false;
        let canProcess = true;
        let timerInterval = null;
        let cdTimer = null;
        let startTimeout = null;

        const qDisplay = document.getElementById('question-display');
        const scoreUI = document.getElementById('score-ui');
        const timerUI = document.getElementById('timer-ui');
        const overlay = document.getElementById('overlay');
        const gameoverOverlay = document.getElementById('gameover-overlay');
        const catUI = document.getElementById('category-ui');

        function renderCategoryButtons() {
            const grid = document.getElementById('cat-grid');
            grid.innerHTML = '';
            Object.keys(ALL_TOPICS).forEach((catName, index) => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                if (index === 0) {
                    btn.classList.add('active');
                    selectedCat = catName;
                }
                btn.innerText = catName;
                btn.onclick = function () { setCat(catName, this); };
                grid.appendChild(btn);
            });
        }

        function renderTimeButtons() {
            const grid = document.getElementById('time-grid');
            grid.innerHTML = '';
            TIME_OPTIONS.forEach((sec) => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                if (sec === 60) {
                    btn.classList.add('active');
                    selectedTime = sec;
                    timeLeft = sec;
                }
                btn.innerText = `${sec}s`;
                btn.onclick = function () { setTime(sec, this); };
                grid.appendChild(btn);
            });
            timerUI.innerText = `TIME: ${selectedTime}`;
        }

        function setCat(cat, btn) {
            selectedCat = cat;
            document.querySelectorAll('#cat-grid .opt-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function setTime(sec, btn) {
            selectedTime = sec;
            timeLeft = sec;
            document.querySelectorAll('#time-grid .opt-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            timerUI.innerText = `TIME: ${sec}`;
        }

        async function initSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                        startCountdown();
                    }
                } catch (e) {
                    console.log('Permission Error:', e);
                    // 即使拒絕也允許使用手動點擊模式開始遊戲
                    startCountdown();
                }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                startCountdown();
            }
        }

        function startCountdown() {
            overlay.style.display = 'none';
            gameoverOverlay.style.display = 'none';
            isGaming = false;
            let count = 3;
            qDisplay.innerText = count;
            qDisplay.style.fontSize = "min(28vw, 12rem)";
            qDisplay.style.color = "var(--accent-gold)";

            cdTimer = setInterval(() => {
                count--;
                if (count > 0) {
                    qDisplay.innerText = count;
                    qDisplay.style.transform = "scale(1.2)";
                    setTimeout(() => qDisplay.style.transform = "scale(1)", 100);
                } else {
                    clearInterval(cdTimer);
                    qDisplay.innerText = "START!";
                    qDisplay.style.fontSize = "min(15vw, 6.8rem)";
                    qDisplay.style.color = "#ffffff";
                    startTimeout = setTimeout(() => { startGame(); }, 400);
                }
            }, 900);
        }

        function startGame() {
            score = 0;
            passCount = 0;
            timeLeft = selectedTime;
            catUI.innerText = selectedCat;
            currentQuestions = [...ALL_TOPICS[selectedCat]].sort(() => Math.random() - 0.5);
            isGaming = true;
            canProcess = true;
            updateUI();
            startTimer();
        }

        function handleOrientation(event) {
            if (!isGaming || !canProcess) return;
            const pitch = event.beta;
            // 橫放額頭：點頭向下 > 130，仰頭向上 < 50
            if (pitch > 130) {
                action('correct');
            } else if (pitch < 50) {
                action('pass');
            }
        }

        function action(type) {
            if (!isGaming || !canProcess) return;
            canProcess = false;

            if (type === 'correct') {
                score++;
                document.body.className = 'feedback-correct';
                qDisplay.innerText = "答對 +1";
                qDisplay.style.fontSize = "min(14vw, 5.5rem)";
                if (navigator.vibrate) navigator.vibrate(50);
            } else {
                passCount++;
                document.body.className = 'feedback-pass';
                qDisplay.innerText = "跳過 PASS";
                qDisplay.style.fontSize = "min(14vw, 5.5rem)";
                if (navigator.vibrate) navigator.vibrate([80, 50, 80]);
            }

            setTimeout(() => {
                document.body.className = '';
                nextQuestion();
                canProcess = true;
            }, 700);
        }

        function nextQuestion() {
            currentQuestions.shift();
            if (currentQuestions.length === 0 || timeLeft <= 0) {
                endGame();
            } else {
                updateUI();
            }
        }

        function updateUI() {
            const q = currentQuestions[0] || "OUT OF TOPICS";
            qDisplay.innerText = q;

            // 依題目字數動態調整字級大小，保持視覺衝擊
            if (q.length >= 7) {
                qDisplay.style.fontSize = "min(10vw, 4.2rem)";
            } else if (q.length >= 5) {
                qDisplay.style.fontSize = "min(12vw, 5.2rem)";
            } else {
                qDisplay.style.fontSize = "min(15vw, 6.8rem)";
            }

            scoreUI.innerText = `SCORE: ${score}`;
            timerUI.innerText = `TIME: ${timeLeft}`;
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isGaming) return;
                timeLeft--;
                timerUI.innerText = `TIME: ${timeLeft}`;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function quitGame() {
            isGaming = false;
            if (timerInterval) clearInterval(timerInterval);
            if (cdTimer) clearInterval(cdTimer);
            if (startTimeout) clearTimeout(startTimeout);
            document.body.className = '';
            resetGameToHome();
        }

        function rematchGame() {
            gameoverOverlay.style.display = 'none';
            startCountdown();
        }

        function endGame() {
            isGaming = false;
            clearInterval(timerInterval);
            document.body.className = '';

            document.getElementById('stat-correct').innerText = score;
            document.getElementById('stat-passed').innerText = passCount;
            document.getElementById('gameover-cat-name').innerText = `【${selectedCat}】挑戰完成`;
            applyRandomDare();
            gameoverOverlay.style.display = 'flex';
        }

        // 處罰設定整合
        function applyRandomDare() {
            const dareEl = document.getElementById('settlement-dare-text');
            if (!dareEl) return;
            if (typeof getRandomDare === 'function') {
                dareEl.innerText = getRandomDare();
            } else {
                dareEl.innerText = '喝一杯特調飲料或伏地挺身 10 下！';
            }
        }

        function triggerDareReroll() {
            const dareEl = document.getElementById('settlement-dare-text');
            if (!dareEl) return;

            if (navigator.vibrate) navigator.vibrate(30);

            // 播放清脆音效
            try {
                const AudioClass = window.AudioContext || window.webkitAudioContext;
                if (AudioClass) {
                    const ctx = new AudioClass();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                }
            } catch (e) { }

            dareEl.style.transition = 'transform 0.15s ease, opacity 0.15s ease';
            dareEl.style.transform = 'scale(0.92)';
            dareEl.style.opacity = '0.4';

            setTimeout(() => {
                applyRandomDare();
                dareEl.style.transform = 'scale(1)';
                dareEl.style.opacity = '1';
            }, 150);
        }

        function resetGameToHome() {
            qDisplay.style.fontSize = "min(15vw, 6.8rem)";
            qDisplay.innerText = "READY?";
            qDisplay.style.color = "white";
            score = 0;
            passCount = 0;
            timeLeft = selectedTime;
            scoreUI.innerText = `SCORE: 0`;
            timerUI.innerText = `TIME: ${selectedTime}`;
            gameoverOverlay.style.display = 'none';
            overlay.style.display = 'flex';
        }

        window.onload = () => {
            renderCategoryButtons();
            renderTimeButtons();
        };
    </script>
