<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#07090e">
    <title>終極密碼：指尖炸彈 - Finger Bomb</title>

    <!-- 全域整合字型樣式表 -->
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --bg-dark: #07090e;
            --neon-orange: #ff9f0a;
            --neon-orange-glow: rgba(255, 159, 10, 0.45);
            --neon-red: #ff3b30;
            --neon-red-glow: rgba(255, 59, 48, 0.55);
            --neon-cyan: #00d2ff;
            --neon-cyan-glow: rgba(0, 210, 255, 0.45);
            --gold-accent: #ffd166;
            --card-glass: rgba(18, 22, 34, 0.88);
            --border-glass: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: var(--font-main);
            touch-action: none;
        }

        /* 觸控容器與全螢幕特效層 */
        #touchContainer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        /* ==========================================================================
           1. 遊戲進行頂部 HUD (In-Game Top HUD)
           ========================================================================== */
        #ingame-hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 56px;
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 0 max(env(safe-area-inset-left, 16px), 16px) 0 max(env(safe-area-inset-right, 16px), 16px);
            background: linear-gradient(180deg, rgba(10, 13, 20, 0.95) 0%, rgba(10, 13, 20, 0.75) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
        }

        .btn-hud-home {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .btn-hud-home:active {
            transform: scale(0.93);
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-hud-home svg {
            width: 13px;
            height: 13px;
            fill: currentColor;
        }

        .hud-center-title {
            font-family: var(--font-display);
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.55);
            text-transform: uppercase;
        }

        .hud-range-badge {
            font-family: var(--font-numeric);
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--neon-orange);
            background: rgba(255, 159, 10, 0.12);
            border: 1px solid rgba(255, 159, 10, 0.3);
            padding: 4px 12px;
            border-radius: 999px;
        }

        /* ==========================================================================
           2. 核心遊戲舞台 (Center Stage)
           ========================================================================== */
        .game-stage {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: calc(56px + max(env(safe-area-inset-top, 10px), 10px)) 20px max(env(safe-area-inset-bottom, 20px), 20px);
            z-index: 2;
        }

        /* 炸彈反應爐圓環 */
        .reactor-wrapper {
            position: relative;
            width: min(240px, 58vw);
            height: min(240px, 58vw);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        /* 外部動態發光進度光環 */
        .reactor-ring-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .reactor-ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 6;
        }

        .reactor-ring-progress {
            fill: none;
            stroke: var(--neon-cyan);
            stroke-width: 7;
            stroke-linecap: round;
            stroke-dasharray: 660;
            stroke-dashoffset: 660;
            transition: stroke-dashoffset 0.3s ease, stroke 0.3s ease;
            filter: drop-shadow(0 0 8px var(--neon-cyan-glow));
        }

        .reactor-ring-progress.warning {
            stroke: var(--neon-orange);
            filter: drop-shadow(0 0 10px var(--neon-orange-glow));
        }

        .reactor-ring-progress.danger {
            stroke: var(--neon-red);
            filter: drop-shadow(0 0 14px var(--neon-red-glow));
        }

        /* 炸彈核心球體 */
        .bomb-core {
            width: 82%;
            height: 82%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #2a3042 0%, #0d1017 75%);
            border: 2px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), inset 0 2px 4px rgba(255, 255, 255, 0.25);
            transition: transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease, border-color 0.2s;
        }

        .bomb-core.active {
            transform: scale(1.08);
            box-shadow: 0 0 50px var(--neon-orange-glow), inset 0 2px 8px rgba(255, 200, 100, 0.4);
            border-color: var(--neon-orange);
        }

        .bomb-core.exploded {
            animation: shake 0.4s infinite alternate;
            background: radial-gradient(circle at 35% 30%, #ff453a 0%, #7f0000 85%) !important;
            box-shadow: 0 0 80px rgba(255, 69, 58, 0.9), inset 0 0 20px rgba(255, 255, 255, 0.6) !important;
            border-color: #ffffff !important;
        }

        @keyframes shake {
            0% {
                transform: translate(3px, 2px) rotate(0deg);
            }

            25% {
                transform: translate(-3px, -3px) rotate(-1.5deg);
            }

            50% {
                transform: translate(4px, -2px) rotate(1.5deg);
            }

            75% {
                transform: translate(-2px, 3px) rotate(-1deg);
            }

            100% {
                transform: translate(2px, -3px) rotate(1deg);
            }
        }

        .current-val {
            font-family: var(--font-numeric);
            font-size: min(5rem, 16vw);
            font-weight: 900;
            color: #ffffff;
            line-height: 1;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
        }

        .current-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* 危險等級指示藥丸 */
        .danger-status-pill {
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 4px 14px;
            border-radius: 999px;
            background: rgba(0, 210, 255, 0.12);
            color: var(--neon-cyan);
            border: 1px solid rgba(0, 210, 255, 0.3);
            margin-bottom: 16px;
            transition: all 0.25s ease;
        }

        .danger-status-pill.warning {
            background: rgba(255, 159, 10, 0.15);
            color: var(--neon-orange);
            border-color: rgba(255, 159, 10, 0.4);
        }

        .danger-status-pill.danger {
            background: rgba(255, 59, 48, 0.22);
            color: var(--neon-red);
            border-color: rgba(255, 59, 48, 0.55);
            animation: pulse-danger 0.8s infinite alternate;
        }

        @keyframes pulse-danger {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 rgba(255, 59, 48, 0);
            }

            100% {
                transform: scale(1.05);
                box-shadow: 0 0 14px rgba(255, 59, 48, 0.6);
            }
        }

        /* 手指數即時反饋條 */
        .touch-count-bar {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--gold-accent);
            text-align: center;
            min-height: 32px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .status-tip-text {
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            margin-top: 6px;
            letter-spacing: 0.3px;
        }

        /* 電腦桌面端快速模擬觸控按鈕列 (非觸控裝置可用) */
        .desktop-touch-sim {
            margin-top: 24px;
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            opacity: 0.85;
        }

        .sim-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-family: var(--font-numeric);
            font-size: 0.85rem;
            font-weight: 800;
            padding: 8px 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .sim-btn:active {
            transform: scale(0.92);
            background: var(--neon-cyan);
            color: #000000;
        }

        /* 觸控點霓虹光暈 */
        .touch-point {
            position: absolute;
            width: 88px;
            height: 88px;
            margin-left: -44px;
            margin-top: -44px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 159, 10, 0.75) 0%, rgba(255, 59, 48, 0.25) 50%, rgba(255, 59, 48, 0) 75%);
            border: 2px solid rgba(255, 255, 255, 0.6);
            pointer-events: none;
            animation: touch-ripple 0.8s infinite alternate ease-in-out;
            box-shadow: 0 0 20px rgba(255, 159, 10, 0.6);
        }

        @keyframes touch-ripple {
            from {
                transform: scale(0.85);
                opacity: 0.8;
            }

            to {
                transform: scale(1.15);
                opacity: 1;
            }
        }

        /* ==========================================================================
           3. 首頁大廳浮層 (Lobby Overlay)
           ========================================================================== */
        #lobby-overlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(env(safe-area-inset-top, 14px), 14px) max(env(safe-area-inset-right, 20px), 20px) max(env(safe-area-inset-bottom, 16px), 16px) max(env(safe-area-inset-left, 20px), 20px);
            background: radial-gradient(circle at 50% 25%, rgba(26, 20, 36, 0.96) 0%, rgba(7, 9, 14, 0.98) 100%);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            transition: opacity 0.3s ease;
        }

        .lobby-top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-pill-link {
            text-decoration: none;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #ffffff;
            font-size: 0.88rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .nav-pill-link:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.18);
        }

        .lobby-tag-badge {
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 999px;
        }

        /* 大廳核心網格卡片 */
        .lobby-content-box {
            width: 100%;
            max-width: 480px;
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .game-badge-icon {
            width: 68px;
            height: 68px;
            background: linear-gradient(135deg, rgba(255, 159, 10, 0.25), rgba(255, 59, 48, 0.25));
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            box-shadow: 0 10px 30px rgba(255, 159, 10, 0.25), 0 0 16px rgba(255, 59, 48, 0.2);
        }

        .lobby-title {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 1px;
            margin: 0;
            background: linear-gradient(180deg, #ffffff 40%, #fed7aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }

        .lobby-subtitle {
            font-size: 0.88rem;
            color: rgba(255, 255, 255, 0.65);
            margin: 4px 0 20px 0;
        }

        /* 選擇密碼範圍 */
        .selector-box {
            width: 100%;
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 14px 16px;
            margin-bottom: 16px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .selector-header {
            font-size: 0.75rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .range-btn-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .range-opt-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 9px 2px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .range-opt-btn:active {
            transform: scale(0.94);
        }

        .range-opt-btn.active {
            background: linear-gradient(135deg, rgba(255, 159, 10, 0.25), rgba(255, 59, 48, 0.35));
            border-color: var(--neon-orange);
            color: #ffffff;
            box-shadow: 0 0 16px rgba(255, 159, 10, 0.4);
        }

        .range-btn-val {
            font-family: var(--font-numeric);
            font-size: 1.15rem;
            font-weight: 800;
            line-height: 1.1;
        }

        .range-btn-sub {
            font-size: 0.65rem;
            opacity: 0.75;
            margin-top: 2px;
        }

        /* 規則指引卡片 */
        .rules-guide-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
            margin-bottom: 22px;
        }

        .guide-icon {
            font-size: 1.6rem;
            flex-shrink: 0;
        }

        .guide-text-box {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.4;
        }

        .guide-text-box strong {
            color: var(--gold-accent);
        }

        /* 開始主按鈕 */
        .btn-start-action {
            width: 100%;
            max-width: 480px;
            background: linear-gradient(135deg, #ff9f0a 0%, #ff3b30 100%);
            border: none;
            color: #ffffff;
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            padding: 16px 24px;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 8px 26px rgba(255, 59, 48, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.15s;
        }

        .btn-start-action:active {
            transform: scale(0.97);
            box-shadow: 0 4px 14px rgba(255, 59, 48, 0.3);
        }

        /* ==========================================================================
           4. 爆炸結算浮層 (Game Over Overlay)
           ========================================================================== */
        #gameover-overlay {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(7, 9, 14, 0.94);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            text-align: center;
        }

        .gameover-card {
            width: 100%;
            max-width: 420px;
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 28px 22px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .explosion-icon-badge {
            font-size: 3.5rem;
            margin-bottom: 6px;
            filter: drop-shadow(0 0 20px rgba(255, 69, 58, 0.7));
            animation: pulse-danger 0.6s infinite alternate;
        }

        .result-title {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--neon-red);
            text-shadow: 0 0 14px var(--neon-red-glow);
            margin: 0 0 4px 0;
        }

        .result-subtitle {
            font-size: 0.86rem;
            color: rgba(255, 255, 255, 0.65);
            margin: 0 0 20px 0;
        }

        /* 最終揭露數字看板 */
        .reveal-board {
            width: 100%;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .reveal-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .reveal-label {
            font-size: 0.75rem;
            font-weight: 700;
            opacity: 0.75;
        }

        .reveal-digit {
            font-family: var(--font-numeric);
            font-size: 2.2rem;
            font-weight: 900;
            line-height: 1;
            color: var(--gold-accent);
        }

        .reveal-digit.boom {
            color: var(--neon-red);
            text-shadow: 0 0 14px var(--neon-red-glow);
        }

        /* 處罰展示區塊 */
        .dare-settlement-box {
            width: 100%;
            background: linear-gradient(135deg, rgba(191, 90, 242, 0.14), rgba(255, 55, 95, 0.16));
            border: 1.5px solid rgba(191, 90, 242, 0.35);
            border-radius: 18px;
            padding: 12px 14px;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 4px 18px rgba(191, 90, 242, 0.25);
            text-align: left;
        }

        .dare-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dare-badge-tag {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--gold-accent);
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .link-edit-dares {
            font-size: 0.72rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            padding: 2px 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            transition: color 0.15s;
        }

        .link-edit-dares:hover {
            color: #ffffff;
        }

        .dare-content-text {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.4;
            transition: opacity 0.2s, transform 0.2s;
        }

        .btn-dare-action {
            width: 100%;
            background: linear-gradient(135deg, #bf5af2 0%, #ff375f 100%);
            border: none;
            color: #ffffff;
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 1px;
            padding: 13px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(191, 90, 242, 0.35);
            transition: transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-dare-action:active {
            transform: scale(0.97);
        }

        /* 結算按鈕群組 */
        .gameover-actions {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-rematch-action {
            background: linear-gradient(135deg, #ff9f0a, #ff3b30);
            border: none;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 800;
            padding: 14px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 59, 48, 0.4);
            transition: transform 0.15s;
        }

        .btn-rematch-action:active {
            transform: scale(0.97);
        }

        .btn-to-lobby-action {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #ffffff;
            font-size: 0.92rem;
            font-weight: 700;
            padding: 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-to-lobby-action:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.16);
        }

        .link-to-hub-btn {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.82rem;
            text-decoration: none;
            margin-top: 4px;
            padding: 6px;
            transition: color 0.2s;
        }

        .link-to-hub-btn:hover {
            color: rgba(255, 255, 255, 0.85);
        }
    </style>
</head>

<body>
    <!-- 觸控即時發光特效容器 -->
    <div id="touchContainer"></div>

    <!-- 1. 遊戲進行頂部狀態列 (HUD) -->
    <header id="ingame-hud">
        <button id="btn-hud-home" class="btn-hud-home" title="返回首頁大廳">
            <svg viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
            </svg>
            <span>首頁</span>
        </button>

        <div class="hud-center-title">FINGER BOMB</div>

        <div class="hud-range-badge" id="hud-range-display">範圍 1 ~ 30</div>
    </header>

    <!-- 2. 核心遊戲舞台 -->
    <main class="game-stage">
        <!-- 炸彈進度環與核心反應爐 -->
        <div class="reactor-wrapper">
            <svg class="reactor-ring-svg" viewBox="0 0 240 240">
                <circle class="reactor-ring-bg" cx="120" cy="120" r="105"></circle>
                <circle class="reactor-ring-progress" id="reactorProgress" cx="120" cy="120" r="105"></circle>
            </svg>

            <div class="bomb-core" id="bombCore">
                <div class="current-val" id="displayVal">0</div>
                <div class="current-label">目前累計指數</div>
            </div>
        </div>

        <!-- 警戒指示藥丸 -->
        <div class="danger-status-pill" id="dangerPill">安全狀態 SAFE</div>

        <!-- 手指即時偵測反饋條 -->
        <div class="touch-count-bar" id="touchBar">
            <span>👉</span>
            <span>請輪流按住螢幕</span>
        </div>

        <div class="status-tip-text" id="statusTip">按住螢幕感應指尖數量，放開即加入累計</div>

        <!-- 電腦鍵盤/滑鼠輔助按鈕 (非觸控螢幕亦可輕鬆測試) -->
        <div class="desktop-touch-sim" id="desktopSim">
            <button class="sim-btn" onclick="simFingerAdd(1)">+1 指</button>
            <button class="sim-btn" onclick="simFingerAdd(2)">+2 指</button>
            <button class="sim-btn" onclick="simFingerAdd(3)">+3 指</button>
            <button class="sim-btn" onclick="simFingerAdd(4)">+4 指</button>
            <button class="sim-btn" onclick="simFingerAdd(5)">+5 指</button>
        </div>
    </main>

    <!-- 3. 首頁大廳浮層 (Lobby Overlay) -->
    <div id="lobby-overlay">
        <!-- 頂部列：返回 Party Hub -->
        <div class="lobby-top-bar">
            <a href="index.html" class="nav-pill-link" title="返回 Party Hub 遊戲大廳">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                </svg>
                Party Hub
            </a>
            <div class="lobby-tag-badge">多人同機派對心跳</div>
        </div>

        <!-- 中央設定內容 -->
        <div class="lobby-content-box">
            <!-- 遊戲發光標誌 -->
            <div class="game-badge-icon">
                <svg width="38" height="38" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2a1 1 0 0 1 1 1v1.07A8.001 8.001 0 0 1 20 12a8 8 0 1 1-16 0 8.001 8.001 0 0 1 7-7.93V3a1 1 0 0 1 1-1zm0 4a6 6 0 1 0 0 12 6 6 0 0 0 0-12zm6-4a1 1 0 0 1 .7.3l1 1a1 1 0 0 1-1.4 1.4l-1-1a1 1 0 0 1 .7-1.7zm-12 0a1 1 0 0 1 .7 1.7l-1 1a1 1 0 0 1-1.4-1.4l1-1a1 1 0 0 1 .7-.3z" />
                </svg>
            </div>

            <h1 class="lobby-title">FINGER BOMB</h1>
            <p class="lobby-subtitle">終極密碼 · 指尖觸控炸彈</p>

            <!-- 範圍選擇器 -->
            <div class="selector-box">
                <div class="selector-header">
                    <span>⏱️</span>
                    <span>密碼爆炸上限 MAX RANGE</span>
                </div>
                <div class="range-btn-grid" id="range-btn-grid">
                    <button class="range-opt-btn" data-range="20">
                        <span class="range-btn-val">20</span>
                        <span class="range-btn-sub">閃電戰</span>
                    </button>
                    <button class="range-opt-btn active" data-range="30">
                        <span class="range-btn-val">30</span>
                        <span class="range-btn-sub">標準賽</span>
                    </button>
                    <button class="range-opt-btn" data-range="50">
                        <span class="range-btn-val">50</span>
                        <span class="range-btn-sub">熱血戰</span>
                    </button>
                    <button class="range-opt-btn" data-range="80">
                        <span class="range-btn-val">80</span>
                        <span class="range-btn-sub">耐力戰</span>
                    </button>
                </div>
            </div>

            <!-- 規則指引 -->
            <div class="rules-guide-card">
                <div class="guide-icon">💣</div>
                <div class="guide-text-box">
                    系統已暗中產生<strong>未知的終極密碼</strong>。<br>
                    每人輪流伸出 1~5 根手指按住螢幕，放開即加入累計，<strong>點數達到或引爆者即淘汰！</strong>
                </div>
            </div>

            <!-- 開始按鈕 -->
            <button id="btn-start-game" class="btn-start-action">
                <span>開始遊戲 START</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z" />
                </svg>
            </button>
        </div>

        <div style="height: 10px;"></div>
    </div>

    <!-- 4. 爆炸結算浮層 (Game Over Overlay) -->
    <div id="gameover-overlay">
        <div class="gameover-card">
            <div class="explosion-icon-badge">💥</div>
            <h2 class="result-title" id="settlement-title">終極密碼引爆！</h2>
            <p class="result-subtitle" id="settlement-subtitle">轟隆一聲！觸發者淘汰出局</p>

            <div class="reveal-board">
                <div class="reveal-item">
                    <span class="reveal-label">終極密碼</span>
                    <span class="reveal-digit" id="final-target-val">0</span>
                </div>
                <div class="reveal-divider">/</div>
                <div class="reveal-item">
                    <span class="reveal-label">最終引爆點數</span>
                    <span class="reveal-digit boom" id="final-current-val">0</span>
                </div>
                <div class="reveal-divider">/</div>
                <div class="reveal-item">
                    <span class="reveal-label">激戰回合</span>
                    <span class="reveal-digit" id="final-rounds-val">0</span>
                </div>
            </div>

            <!-- 輸家處罰展示區 -->
            <div class="dare-settlement-box">
                <div class="dare-header-row">
                    <span class="dare-badge-tag">⚡ 輸家處罰 PENALTY</span>
                    <a href="dares.html" class="link-edit-dares" title="前往設定處罰內容">⚙️ 設定處罰</a>
                </div>
                <div class="dare-content-text" id="settlement-dare-text">載入處罰中...</div>
            </div>

            <div class="gameover-actions">
                <button class="btn-dare-action" onclick="triggerDareReroll()">
                    <span>🎲 抽取處罰 / 換一個</span>
                </button>
                <button id="btn-rematch" class="btn-rematch-action">再玩一局 REMATCH</button>
                <button id="btn-to-lobby" class="btn-to-lobby-action">返回遊戲首頁</button>
                <a href="index.html" class="link-to-hub-btn">返回 Party Hub 大廳</a>
            </div>
        </div>
    </div>

    <!-- 引用全域共用處罰模組 -->
    <script src="dares.js"></script>

    <!-- 遊戲程式腳本 -->
    <script>
        // ==========================================
        // 1. Web Audio 音效合成器
        // ==========================================
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSynth(freqStart, freqEnd, type, duration, vol = 0.25) {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
                if (freqEnd && freqEnd !== freqStart) {
                    osc.frequency.exponentialRampToValueAtTime(Math.max(10, freqEnd), audioCtx.currentTime + duration);
                }
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (err) { }
        }

        // 爆炸白噪聲合成
        function playExplosionNoise() {
            try {
                initAudio();
                if (!audioCtx) return;
                const bufferSize = audioCtx.sampleRate * 1.2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(600, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 1.2);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start();

                // 同時疊加低頻下潛音
                playSynth(150, 20, 'sawtooth', 1.0, 0.5);
            } catch (err) { }
        }

        const sounds = {
            touchIn() { playSynth(320, 480, 'sine', 0.08, 0.2); },
            addPoint(ratio) {
                // 越接近炸彈，頻率越高、緊張感倍增
                const baseFreq = 400 + ratio * 450;
                playSynth(baseFreq, baseFreq * 1.25, 'triangle', 0.15, 0.3);
            },
            explosion() {
                playExplosionNoise();
            },
            click() { playSynth(800, 800, 'sine', 0.04, 0.15); }
        };

        // ==========================================
        // 2. 遊戲狀態與邏輯變數
        // ==========================================
        let gameState = 'lobby'; // 'lobby' | 'playing' | 'ended'
        let selectedMaxRange = 30;
        let targetBomb = 0;
        let currentScore = 0;
        let roundsCount = 0;
        let activeTouches = 0;

        // DOM 元素
        const lobbyOverlay = document.getElementById('lobby-overlay');
        const ingameHud = document.getElementById('ingame-hud');
        const gameoverOverlay = document.getElementById('gameover-overlay');
        const bombCore = document.getElementById('bombCore');
        const displayVal = document.getElementById('displayVal');
        const touchBar = document.getElementById('touchBar');
        const statusTip = document.getElementById('statusTip');
        const dangerPill = document.getElementById('dangerPill');
        const reactorProgress = document.getElementById('reactorProgress');
        const hudRangeDisplay = document.getElementById('hud-range-display');
        const touchContainer = document.getElementById('touchContainer');

        // 圓環總周長 (r=105, 2 * pi * 105 ≈ 660)
        const CIRCUMFERENCE = 660;

        // ==========================================
        // 3. 範圍選擇器處理
        // ==========================================
        const rangeGrid = document.getElementById('range-btn-grid');
        rangeGrid.querySelectorAll('.range-opt-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                initAudio();
                sounds.click();
                rangeGrid.querySelectorAll('.range-opt-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedMaxRange = parseInt(btn.getAttribute('data-range'), 10) || 30;
            });
        });

        function updateProgressRing() {
            const ratio = Math.min(1, currentScore / targetBomb);
            const offset = CIRCUMFERENCE - (CIRCUMFERENCE * ratio);
            reactorProgress.style.strokeDashoffset = offset;

            // 根據危險比例切換燈號
            if (ratio < 0.45) {
                reactorProgress.className = 'reactor-ring-progress';
                dangerPill.className = 'danger-status-pill';
                dangerPill.textContent = '安全狀態 SAFE';
            } else if (ratio < 0.8) {
                reactorProgress.className = 'reactor-ring-progress warning';
                dangerPill.className = 'danger-status-pill warning';
                dangerPill.textContent = '⚠️ 警戒升高 CAUTION';
            } else {
                reactorProgress.className = 'reactor-ring-progress danger';
                dangerPill.className = 'danger-status-pill danger';
                dangerPill.textContent = '🔥 極度危險 CRITICAL';
            }
        }

        function startNewGame() {
            initAudio();
            sounds.click();

            // 隨機產生終極密碼：範圍在 [min, max] 之間
            const minBomb = Math.max(8, Math.floor(selectedMaxRange * 0.4));
            targetBomb = Math.floor(Math.random() * (selectedMaxRange - minBomb + 1)) + minBomb;

            currentScore = 0;
            roundsCount = 0;
            activeTouches = 0;
            gameState = 'playing';

            bombCore.className = 'bomb-core';
            displayVal.textContent = currentScore;
            hudRangeDisplay.textContent = `範圍 1 ~ ${selectedMaxRange}`;
            touchBar.innerHTML = '<span>👉</span><span>請輪流按住螢幕</span>';
            statusTip.textContent = '按住螢幕感應指尖數量，放開即加入累計';
            touchContainer.innerHTML = '';

            updateProgressRing();

            lobbyOverlay.style.display = 'none';
            gameoverOverlay.style.display = 'none';
            ingameHud.style.display = 'flex';
        }

        function returnToLobby() {
            gameState = 'lobby';
            touchContainer.innerHTML = '';
            bombCore.className = 'bomb-core';

            ingameHud.style.display = 'none';
            gameoverOverlay.style.display = 'none';
            lobbyOverlay.style.display = 'flex';
        }

        // ==========================================
        // 4. 手指累加與爆炸觸發
        // ==========================================
        function addFingers(count) {
            if (gameState !== 'playing' || count <= 0) return;

            currentScore += count;
            roundsCount++;
            displayVal.textContent = currentScore;

            const ratio = currentScore / targetBomb;
            sounds.addPoint(ratio);
            updateProgressRing();

            if (currentScore >= targetBomb) {
                // 踩中炸彈！引爆
                triggerExplosion(currentScore > targetBomb);
            } else {
                touchBar.innerHTML = `<span>⚡</span><span>已加入 +${count} 指！換下一位</span>`;
                statusTip.textContent = `累計已達 ${currentScore}，密碼越來越近了...`;
            }
        }

        function triggerExplosion(overloaded = false) {
            gameState = 'ended';
            sounds.explosion();

            bombCore.classList.add('exploded');
            touchBar.innerHTML = overloaded ? '<span>💥</span><span>能量超載！瞬間引爆！</span>' : '<span>💥</span><span>命中終極密碼！大爆炸！</span>';

            // 手機震動
            if (navigator.vibrate) {
                navigator.vibrate([200, 100, 250, 100, 450]);
            }

            // 延遲展示結算卡片
            setTimeout(() => {
                document.getElementById('settlement-title').textContent = overloaded ? '能量超載引爆！' : '命中終極密碼！';
                document.getElementById('settlement-subtitle').textContent = `第 ${roundsCount} 回合踩雷，引爆者淘汰！`;
                document.getElementById('final-target-val').textContent = targetBomb;
                document.getElementById('final-current-val').textContent = currentScore;
                document.getElementById('final-rounds-val').textContent = roundsCount;

                ingameHud.style.display = 'none';
                gameoverOverlay.style.display = 'flex';
                applyRandomDare();
            }, 1100);
        }

        // 處罰隨機挑選與重抽
        function applyRandomDare() {
            const dareEl = document.getElementById('settlement-dare-text');
            if (dareEl && typeof getRandomDare === 'function') {
                dareEl.innerText = getRandomDare();
            }
        }

        function triggerDareReroll() {
            const dareEl = document.getElementById('settlement-dare-text');
            if (dareEl && typeof getRandomDare === 'function') {
                dareEl.style.opacity = '0.3';
                dareEl.style.transform = 'scale(0.96)';
                setTimeout(() => {
                    dareEl.innerText = getRandomDare();
                    dareEl.style.opacity = '1';
                    dareEl.style.transform = 'scale(1)';
                }, 140);
                sounds.touchIn();
            }
            if (navigator.vibrate) navigator.vibrate(40);
        }

        // 電腦端鍵盤與按鈕測試
        function simFingerAdd(num) {
            if (gameState !== 'playing') return;
            bombCore.classList.add('active');
            setTimeout(() => {
                bombCore.classList.remove('active');
                addFingers(num);
            }, 180);
        }

        // 支援鍵盤 1~5 數字鍵快捷測試
        window.addEventListener('keydown', (e) => {
            if (gameState === 'playing' && e.key >= '1' && e.key <= '5') {
                simFingerAdd(parseInt(e.key, 10));
            }
        });

        // ==========================================
        // 5. 多點觸控 (Multi-Touch) 監聽
        // ==========================================
        function isInteractive(target) {
            return target.closest && target.closest('#lobby-overlay, #gameover-overlay, #ingame-hud, #desktopSim, button, a');
        }

        function renderTouchPoints(e) {
            if (gameState !== 'playing') return;
            touchContainer.innerHTML = '';
            activeTouches = e.touches.length;

            if (activeTouches > 0) {
                bombCore.classList.add('active');
                touchBar.innerHTML = `<span>⚡</span><span>偵測到 ${activeTouches} 根手指 (+${activeTouches})</span>`;
                statusTip.textContent = '放開手指即完成充能並結算累加！';

                for (let i = 0; i < e.touches.length; i++) {
                    const t = e.touches[i];
                    const dot = document.createElement('div');
                    dot.className = 'touch-point';
                    dot.style.left = t.clientX + 'px';
                    dot.style.top = t.clientY + 'px';
                    touchContainer.appendChild(dot);
                }
            }
        }

        window.addEventListener('touchstart', (e) => {
            if (gameState !== 'playing' || isInteractive(e.target)) return;
            e.preventDefault();
            sounds.touchIn();
            renderTouchPoints(e);
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (gameState !== 'playing' || isInteractive(e.target)) return;
            e.preventDefault();
            renderTouchPoints(e);
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (gameState !== 'playing' || isInteractive(e.target)) return;
            e.preventDefault();

            // 當所有手指離開螢幕時結算最後感應到的數量
            if (e.touches.length === 0 && activeTouches > 0) {
                const count = activeTouches;
                activeTouches = 0;
                bombCore.classList.remove('active');
                touchContainer.innerHTML = '';
                addFingers(count);
            } else {
                renderTouchPoints(e);
            }
        }, { passive: false });

        window.addEventListener('touchcancel', (e) => {
            activeTouches = 0;
            bombCore.classList.remove('active');
            touchContainer.innerHTML = '';
        });

        // 按鈕點擊綁定
        document.getElementById('btn-start-game').addEventListener('click', startNewGame);
        document.getElementById('btn-rematch').addEventListener('click', startNewGame);
        document.getElementById('btn-hud-home').addEventListener('click', returnToLobby);
        document.getElementById('btn-to-lobby').addEventListener('click', returnToLobby);
    </script>
</body>

</html>
