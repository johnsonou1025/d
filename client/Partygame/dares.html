<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Party Dares - 派對處罰箱設定</title>

    <!-- 全域整合字型樣式表 -->
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --bg-oled: #000000;
            --card-glass: rgba(28, 28, 30, 0.82);
            --card-border: rgba(255, 255, 255, 0.1);
            --card-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.12);
            --neon-purple: #bf5af2;
            --neon-purple-glow: rgba(191, 90, 242, 0.4);
            --neon-pink: #ff375f;
            --neon-pink-glow: rgba(255, 55, 95, 0.4);
            --neon-amber: #ff9f0a;
            --gold-accent: #ffd166;
            --label-primary: #ffffff;
            --label-secondary: #8e8e93;
            --card-radius: 22px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-oled);
            background-image:
                radial-gradient(circle at 50% 12%, rgba(191, 90, 242, 0.16) 0%, transparent 60%),
                radial-gradient(circle at 80% 40%, rgba(255, 55, 95, 0.1) 0%, transparent 50%);
            color: var(--label-primary);
            font-family: var(--font-main);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            overflow-x: hidden;
        }

        /* 外部裝置置中容器 */
        .app-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding: max(env(safe-area-inset-top, 24px), 24px) 20px calc(40px + env(safe-area-inset-bottom, 24px));
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 頂部導航列 */
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .nav-pill-link {
            text-decoration: none;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #ffffff;
            font-size: 0.88rem;
            font-weight: 700;
            padding: 7px 14px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .nav-pill-link:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.18);
        }

        .nav-tag-badge {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--neon-purple);
            background: rgba(191, 90, 242, 0.12);
            border: 1px solid rgba(191, 90, 242, 0.3);
            padding: 4px 12px;
            border-radius: 999px;
            letter-spacing: 0.8px;
        }

        /* 頁面主視覺 Header */
        .hero-banner {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
        }

        .hero-icon {
            width: 60px;
            height: 60px;
            min-width: 60px;
            border-radius: 18px;
            background: linear-gradient(135deg, #bf5af2 0%, #ff375f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px var(--neon-purple-glow), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            font-size: 1.8rem;
        }

        .hero-texts {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .hero-title {
            font-size: 1.55rem;
            font-weight: 900;
            letter-spacing: -0.3px;
            background: linear-gradient(180deg, #ffffff 40%, #e2d9f3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1.2;
        }

        .hero-subtitle {
            font-size: 0.82rem;
            color: var(--label-secondary);
            margin: 0;
        }

        /* 規則說明提示卡片 */
        .guide-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px dashed rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            padding: 12px 16px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 24px;
            font-size: 0.8rem;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.78);
        }

        .guide-icon {
            font-size: 1.2rem;
            line-height: 1;
        }

        /* 5 筆處罰設定清單 */
        .dares-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .dare-card {
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--card-radius);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), var(--card-highlight);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: transform 0.15s, border-color 0.2s;
        }

        .dare-card:focus-within {
            border-color: var(--neon-purple);
            box-shadow: 0 0 16px var(--neon-purple-glow), var(--card-highlight);
        }

        .dare-badge-num {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--gold-accent);
            font-family: var(--font-numeric);
            font-size: 0.95rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dare-input-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .dare-input-label {
            font-size: 0.68rem;
            color: rgba(255, 255, 255, 0.45);
            font-weight: 700;
            margin-bottom: 3px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .dare-input {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: var(--font-main);
            font-size: 0.92rem;
            font-weight: 600;
            outline: none;
            padding: 0;
            user-select: text;
            -webkit-user-select: text;
        }

        .dare-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        /* 隨機靈感按鈕 */
        .btn-dice {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .btn-dice:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.18);
        }

        /* 按鈕群組 */
        .actions-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 32px;
        }

        .btn-save-primary {
            width: 100%;
            background: linear-gradient(135deg, #bf5af2 0%, #ff375f 100%);
            border: none;
            color: #ffffff;
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 1px;
            padding: 15px;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 8px 24px var(--neon-purple-glow), inset 0 1px 0 rgba(255, 255, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn-save-primary:active {
            transform: scale(0.97);
            box-shadow: 0 4px 12px var(--neon-purple-glow);
        }

        .btn-reset-defaults {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.82rem;
            font-weight: 700;
            padding: 8px;
            cursor: pointer;
            transition: color 0.15s;
            text-align: center;
        }

        .btn-reset-defaults:active {
            color: rgba(255, 255, 255, 0.9);
        }

        /* --- 即時處罰抽籤試玩 (Live Dare Random Draw) --- */
        .draw-section {
            background: linear-gradient(145deg, rgba(28, 28, 30, 0.8), rgba(16, 16, 20, 0.9));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--card-radius);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), var(--card-highlight);
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .draw-section-tag {
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--gold-accent);
            margin-bottom: 8px;
        }

        .draw-section-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin: 0 0 14px 0;
            color: var(--label-primary);
        }

        .dare-result-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1.5px solid rgba(191, 90, 242, 0.3);
            border-radius: 16px;
            padding: 16px 14px;
            margin-bottom: 16px;
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.4;
            transition: all 0.25s ease;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .dare-result-box.revealing {
            transform: scale(1.03);
            border-color: var(--neon-pink);
            box-shadow: 0 0 20px var(--neon-pink-glow), inset 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .btn-draw-action {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 800;
            padding: 10px 24px;
            border-radius: 999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s;
        }

        .btn-draw-action:active {
            transform: scale(0.93);
            background: rgba(255, 255, 255, 0.2);
        }

        /* 成功提示 Toast */
        .toast-bubble {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translate(-50%, -100px);
            background: rgba(48, 209, 88, 0.92);
            color: #ffffff;
            font-size: 0.88rem;
            font-weight: 800;
            padding: 10px 20px;
            border-radius: 999px;
            box-shadow: 0 8px 24px rgba(48, 209, 88, 0.4);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast-bubble.show {
            transform: translate(-50%, 0);
            opacity: 1;
        }
    </style>
</head>

<body>
    <!-- 儲存成功彈窗提示 -->
    <div id="toast" class="toast-bubble">
        <span>✓</span>
        <span>處罰設定已成功儲存！</span>
    </div>

    <div class="app-container">
        <!-- 頂部導覽列 -->
        <div class="header-nav">
            <a href="index.html" class="nav-pill-link">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"></path>
                </svg>
                Party Hub
            </a>
            <span class="nav-tag-badge">DARES CONFIG</span>
        </div>

        <!-- 主標題橫幅 -->
        <div class="hero-banner">
            <div class="hero-icon">⚡</div>
            <div class="hero-texts">
                <h1 class="hero-title">派對處罰箱</h1>
                <p class="hero-subtitle">設定 5 筆比賽結束後的冒險懲罰</p>
            </div>
        </div>

        <!-- 規則指引卡片 -->
        <div class="guide-card">
            <span class="guide-icon">💡</span>
            <div>
                在<strong>桌上冰球、終極密碼、哆寶、比手畫腳</strong>等任何遊戲分出勝負後，系統將自動從這 5 筆處罰中隨機抽取一筆！點擊右側骰子可快速換取熱門處罰靈感。
            </div>
        </div>

        <!-- 5 筆處罰輸入卡片 -->
        <div class="dares-list" id="dares-list-container">
            <!-- 由 JS 動態生成 5 筆卡片 -->
        </div>

        <!-- 儲存與重置按鈕 -->
        <div class="actions-group">
            <button class="btn-save-primary" onclick="handleSaveDares()">
                <span>儲存處罰設定 SAVE</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"></path>
                </svg>
            </button>
            <button class="btn-reset-defaults" onclick="handleResetDefaults()">
                恢復預設處罰內容 RESET DEFAULTS
            </button>
        </div>

        <!-- 即時處罰試抽展示區 -->
        <div class="draw-section">
            <div class="draw-section-tag">LIVE TEST · 即時試抽</div>
            <div class="draw-section-title">抽籤效果預覽</div>
            <div class="dare-result-box" id="sample-result">
                點擊下方按鈕試抽一筆處罰...
            </div>
            <button class="btn-draw-action" onclick="handleDrawSample()">
                <span>🎲 立即隨機抽一筆</span>
            </button>
        </div>
    </div>

    <!-- 引用全域共用處罰模組 -->
    <script src="dares.js"></script>

    <script>
        // 音效模組
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        const audioCtx = AudioClass ? new AudioClass() : null;

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'save') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.15); // C6
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'dice') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'draw') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        // 渲染 5 筆處罰輸入卡片
        function renderDareCards() {
            const currentDares = getPartyDares();
            const container = document.getElementById('dares-list-container');
            container.innerHTML = '';

            for (let i = 0; i < 5; i++) {
                const card = document.createElement('div');
                card.className = 'dare-card';
                card.innerHTML = `
                    <div class="dare-badge-num">0${i + 1}</div>
                    <div class="dare-input-wrapper">
                        <span class="dare-input-label">處罰項目 #${i + 1}</span>
                        <input type="text" class="dare-input" id="dare-input-${i}" value="${escapeHtml(currentDares[i])}" placeholder="請輸入處罰內容...">
                    </div>
                    <button class="btn-dice" title="換個靈感" onclick="rollInspiration(${i})">🎲</button>
                `;
                container.appendChild(card);
            }
        }

        // 點擊骰子換靈感
        function rollInspiration(index) {
            playSound('dice');
            if (navigator.vibrate) navigator.vibrate(30);

            // 隨機挑選一筆不同的靈感
            const input = document.getElementById(`dare-input-${index}`);
            const filtered = INSPIRATION_DARES.filter(item => item !== input.value);
            const randomItem = filtered[Math.floor(Math.random() * filtered.length)];
            input.value = randomItem;

            // 輕微高亮動畫
            input.parentElement.parentElement.style.transform = 'scale(1.02)';
            setTimeout(() => {
                input.parentElement.parentElement.style.transform = 'scale(1)';
            }, 150);
        }

        // 儲存設定
        function handleSaveDares() {
            const newDares = [];
            for (let i = 0; i < 5; i++) {
                const val = document.getElementById(`dare-input-${i}`).value.trim();
                if (!val) {
                    alert(`第 ${i + 1} 筆處罰內容不能為空！`);
                    document.getElementById(`dare-input-${i}`).focus();
                    return;
                }
                newDares.push(val);
            }

            savePartyDares(newDares);
            playSound('save');
            if (navigator.vibrate) navigator.vibrate([40, 60, 40]);

            showToast();
        }

        // 恢復預設
        function handleResetDefaults() {
            if (confirm("確定要將 5 筆處罰內容恢復為系統預設值嗎？")) {
                savePartyDares(DEFAULT_DARES);
                renderDareCards();
                showToast("已恢復預設處罰！");
            }
        }

        // 試抽一筆處罰
        function handleDrawSample() {
            playSound('draw');
            if (navigator.vibrate) navigator.vibrate([80, 50, 80]);

            const box = document.getElementById('sample-result');
            box.classList.add('revealing');

            // 快速閃爍效果
            let counter = 0;
            const dares = getPartyDares();
            const interval = setInterval(() => {
                box.innerText = dares[Math.floor(Math.random() * dares.length)];
                counter++;
                if (counter > 8) {
                    clearInterval(interval);
                    const finalChoice = getRandomDare();
                    box.innerHTML = `<span style="color:var(--gold-accent);">💥 抽中處罰：</span><br>${escapeHtml(finalChoice)}`;
                    setTimeout(() => box.classList.remove('revealing'), 300);
                }
            }, 60);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (msg) toast.querySelector('span:last-child').innerText = msg;
            else toast.querySelector('span:last-child').innerText = "處罰設定已成功儲存！";
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2200);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        window.onload = renderDareCards;
    </script>
</body>

</html>
