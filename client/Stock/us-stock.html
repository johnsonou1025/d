<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0F14">
  <title>JOINJO 股票數據平台 - 美股量化智慧分析版</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700;800&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              black: '#0A0F14',
              surface: '#0D1117',
              card: '#151C24',
              cardHover: '#1A232E',
              neonGreen: '#00E701',
              neonGreenDark: '#00B801',
              cyberGold: '#FFB800',
              goldAmber: '#F59E0B',
              neonRed: '#FF3366',
              cyberCyan: '#00F0FF',
            }
          },
          boxShadow: {
            'neon-green': '0 0 25px rgba(0, 231, 1, 0.45)',
            'neon-gold': '0 0 25px rgba(255, 184, 0, 0.45)',
            'neon-red': '0 0 20px rgba(255, 51, 102, 0.4)',
          }
        }
      }
    }
  </script>

  <!-- Stylesheets & Scripts -->
  <link rel="stylesheet" href="style.css">
  <script src="jquery-3.7.0.min.js"></script>
  <script src="us-stock.js"></script>
</head>

<body class="loading-view bg-[#0A0F14] text-slate-100 selection:bg-[#00E701] selection:text-black">
  <!-- =========================================================================
         0. LOADING SCREEN (Smoothly fades when data loads)
    ========================================================================= -->
  <div class="status-wrapper">
    <svg class="loading-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2">
      <circle cx="12" cy="12" r="10" stroke-opacity="0.2"></circle>
      <path d="M12 2a10 10 0 0 1 10 10" stroke="#00E701" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.9s"
          repeatCount="indefinite" />
      </path>
    </svg>
    <p class="results">JOINJO 美股量化投資數據庫連線中…</p>
  </div>

  <!-- =========================================================================
         1. GLOBAL TOPBAR (VIP Pro Header)
    ========================================================================= -->
  <header id="header"
    class="sticky top-0 z-50 h-16 bg-[#0D1117]/95 backdrop-blur-xl border-b border-white/10 px-3 sm:px-4 lg:px-8 flex items-center justify-between shadow-[0_4px_30px_rgba(0,0,0,0.8)]">
    <!-- Left: Logo & Brand -->
    <div id="header-brand-section" class="flex items-center gap-3 flex-shrink-0">
      <a href="index.html" class="flex items-center gap-2.5 sm:gap-3 cursor-pointer group">
        <div
          class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-amber-400 via-yellow-500 to-amber-700 p-[1.5px] shadow-[0_0_15px_rgba(255,184,0,0.35)] group-hover:scale-105 transition-transform">
          <div class="w-full h-full bg-[#0A0F14] rounded-[10px] flex items-center justify-center">
            <svg class="w-5 h-5 text-[#FFB800] drop-shadow-[0_0_8px_rgba(255,184,0,0.8)]"
              xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14" />
            </svg>
          </div>
        </div>
        <div class="hidden sm:flex flex-col">
          <div class="flex items-center gap-1.5 sm:gap-2">
            <h1
              class="text-lg sm:text-xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-amber-200 via-yellow-400 to-amber-500 font-mono m-0 p-0 leading-none">
              JOINJO
            </h1>
            <span
              class="version-badge px-1.5 py-0.5 text-[9px] font-black rounded tracking-widest bg-cyan-500/10 text-cyan-400 border border-cyan-500/40 shadow-[0_0_10px_rgba(0,240,255,0.3)] leading-tight">
              US
            </span>
          </div>
          <p class="text-[10px] text-slate-400 font-medium m-0 mt-1 tracking-wide hidden sm:block">美股量化智慧分析平台</p>
        </div>
      </a>
    </div>

    <!-- Center: Market Switch Chips (Centered) -->
    <div id="header-center-section" class="flex items-center justify-center flex-1 mx-2 sm:mx-4">
      <!-- Market Pills (台股現貨 / 美股現貨切換) -->
      <div id="header-market-pills"
        class="flex items-center p-1 bg-[#151C24] rounded-xl border border-white/10 shadow-inner flex-shrink-0">
        <a href="index.html"
          class="px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-lg text-[11px] sm:text-xs font-semibold transition-all flex items-center gap-1.5 text-slate-400 hover:text-white hover:bg-white/5 cursor-pointer">
          台股現貨
        </a>
        <button type="button"
          class="px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-lg text-[11px] sm:text-xs font-bold transition-all flex items-center gap-1.5 sm:gap-2 bg-[#00E701]/15 text-[#00E701] border border-[#00E701]/40 shadow-[0_0_10px_rgba(0,231,1,0.25)]">
          <span class="w-2 h-2 rounded-full bg-[#00E701] animate-pulse shadow-[0_0_6px_#00E701]"></span>
          美股現貨
        </button>
      </div>
    </div>

    <!-- Right: Search Toggle, Live Update Status Pill & Trader Profile -->
    <div id="header-right-section" class="flex items-center gap-2 sm:gap-3 lg:gap-4 flex-shrink-0">
      <!-- Search Toggle Button (Mobile & Desktop Unified) -->
      <button type="button" id="mobile-search-toggle"
        class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-[#151C24] text-slate-300 hover:text-[#00E701] border border-white/10 hover:border-[#00E701]/40 active:scale-95 transition-all flex items-center justify-center shadow-sm cursor-pointer"
        title="搜尋美股 (代碼 / 名稱)">
        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
      </button>

      <!-- Live Sync / Data Update Status Pill -->
      <div id="header-update-status" class="data-update-time hidden sm:inline-flex group"
        title="美股每日 05:15 ~ 05:30 AM 自動結算更新；點擊可手動強制重新載入數據">
        <span class="text-slate-400">連線中...</span>
      </div>

      <!-- User Profile / VIP Trader Avatar -->
      <div id="header-user-profile" class="flex items-center gap-2 sm:gap-2.5 pl-2 lg:pl-3 border-l border-white/10">
        <div class="relative cursor-pointer group">
          <div
            class="w-8 h-8 sm:w-9 sm:h-9 rounded-full overflow-hidden bg-white shadow-[0_0_10px_rgba(255,255,255,0.2)] flex items-center justify-center group-hover:scale-105 transition-all">
            <img src="img/Bull_mascot_profile_avatar_design.png" alt="Avatar"
              class="w-full h-full object-cover rounded-full" />
          </div>
        </div>
        <div class="hidden xl:flex flex-col text-left">
          <div class="flex items-center gap-1.5">
            <span class="text-xs font-bold text-white tracking-wide">VIP TRADER</span>
            <span
              class="px-1 py-0.2 text-[9px] font-black font-mono rounded bg-amber-500/10 text-amber-400 border border-amber-500/30">PRO</span>
          </div>
          <span class="text-[10px] text-slate-400 font-mono">美股實戰帳戶</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Search Bar Dropdown Container (Slides down when toggle is clicked) -->
  <div id="mobile-search-container"
    class="hidden bg-[#0D1117] border-b border-white/10 px-4 py-3 relative z-40 shadow-2xl">
    <div class="max-w-2xl mx-auto relative w-full flex items-center">
      <svg class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"
        xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </svg>
      <input type="text" id="mobile-stock-search-input" placeholder="搜尋美股代碼或名稱 (例: NVDA 輝達、TSLA 特斯拉、AAPL)..."
        class="w-full bg-[#151C24] text-xs text-white placeholder-slate-500 pl-10 pr-24 py-2.5 rounded-xl border border-white/10 focus:outline-none focus:border-[#00E701]/60 focus:ring-2 focus:ring-[#00E701]/20 font-mono" />
      <button id="mobile-stock-search-btn"
        class="absolute right-1.5 top-1/2 -translate-y-1/2 px-3 py-1.5 rounded-lg bg-[#00E701] text-black font-black text-xs hover:brightness-110 active:scale-95 transition-all shadow-[0_0_10px_rgba(0,231,1,0.35)]">
        搜尋
      </button>
    </div>
    <div id="mobile-stock-search-result"
      class="max-w-2xl mx-auto hidden mt-2 bg-[#151C24] border border-white/15 rounded-xl shadow-2xl overflow-hidden">
    </div>
  </div>

  <!-- =========================================================================
         2. MAIN DASHBOARD CONTENT (ONLY #today-strong & #today-suggestions)
    ========================================================================= -->
  <div id="app-container" class="min-h-[calc(100vh-64px)] w-full max-w-full flex flex-col overflow-x-hidden">
    <main class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-8 flex-1">

      <!-- =====================================================================
           A. 強勢美股推薦 (Stock Grid - Horizontal Scroll)
           ===================================================================== -->
      <div id="today-strong" class="space-y-4">
        <div id="today-strong-header" class="flex items-center justify-between flex-wrap gap-2">
          <h2 class="section-title !mb-0">
            <span class="flex items-center gap-2">
              <span>💎</span> 強勢美股推薦 // US HOT MOMENTUM
            </span>
          </h2>
          <div class="flex items-center gap-2 shrink-0">
            <span id="today-strong-date-pill"
              class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 font-bold">近5日推薦</span>
            <div class="flex items-center gap-1.5 ml-1">
              <button id="today-strong-prev" type="button" disabled
                class="carousel-nav-btn is-disabled p-1.5 rounded-xl bg-[#151C24] hover:bg-[#1E2733] active:scale-90 active:bg-cyan-500/20 border border-white/10 hover:border-cyan-500/40 text-slate-300 hover:text-white transition-all text-xs cursor-pointer flex items-center justify-center w-8 h-8 shadow-sm"
                title="上一頁 (向左滑動)">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
              </button>
              <button id="today-strong-next" type="button"
                class="carousel-nav-btn p-1.5 rounded-xl bg-[#151C24] hover:bg-[#1E2733] active:scale-90 active:bg-cyan-500/20 border border-white/10 hover:border-cyan-500/40 text-slate-300 hover:text-white transition-all text-xs cursor-pointer flex items-center justify-center w-8 h-8 shadow-sm"
                title="下一頁 (向右滑動)">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- 橫向卡片列表容器 (隱藏滑動軸，支援觸控平滑滑動) -->
        <div id="today-strong-scroll-wrapper" class="strong-cards-scroll overflow-x-auto pb-2 pt-1 w-full max-w-full">
          <div id="today-strong-cards" class="flex gap-3 sm:gap-4 flex-nowrap w-max min-w-full">
            <!-- 由 JS renderStrongCards 動態生成卡片 -->
          </div>
        </div>
      </div>

      <!-- =====================================================================
           B. 今日美股操作建議 (Hot Picks: 建議買進 / 建議賣出)
           ===================================================================== -->
      <div id="today-suggestions" class="space-y-4">
        <div class="flex items-center justify-between flex-wrap gap-2">
          <h2 class="section-title !mb-0">
            <span class="flex items-center gap-2">
              <span>⚡</span> 今日美股操作建議 // US HOT PICKS
            </span>
          </h2>
        </div>
        <div id="today-suggestions-grid" class="space-y-6 flex flex-col">
          <!-- 建議買進 (STRONG BUY) 橫向卡片滾動區 -->
          <div id="today-buy" class="space-y-4">
            <div id="today-buy-header" class="flex items-center justify-between flex-wrap gap-2">
              <h3 class="text-sm sm:text-base font-bold text-[#00E701] m-0 flex items-center gap-2">
                建議買進 // STRONG BUY
              </h3>
              <div class="flex items-center gap-2 shrink-0">
                <span id="today-buy-date-pill"
                  class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-[#00E701]/10 text-[#00E701] border border-[#00E701]/30 font-bold">近5日買進</span>
                <div class="flex items-center gap-1.5 ml-1">
                  <button id="today-buy-prev" type="button" disabled
                    class="carousel-nav-btn is-disabled p-1.5 rounded-xl bg-[#151C24] hover:bg-[#1E2733] active:scale-90 active:bg-emerald-500/20 border border-white/10 hover:border-emerald-500/40 text-slate-300 hover:text-white transition-all text-xs cursor-pointer flex items-center justify-center w-8 h-8 shadow-sm"
                    title="上一頁 (向左滑動)">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                  </button>
                  <button id="today-buy-next" type="button"
                    class="carousel-nav-btn p-1.5 rounded-xl bg-[#151C24] hover:bg-[#1E2733] active:scale-90 active:bg-emerald-500/20 border border-white/10 hover:border-emerald-500/40 text-slate-300 hover:text-white transition-all text-xs cursor-pointer flex items-center justify-center w-8 h-8 shadow-sm"
                    title="下一頁 (向右滑動)">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
            <!-- 橫向卡片滾動容器 -->
            <div id="today-buy-scroll-wrapper"
              class="buy-cards-scroll strong-cards-scroll overflow-x-auto pb-2 pt-1 w-full max-w-full">
              <div id="today-buy-cards" class="flex gap-3 sm:gap-4 flex-nowrap w-max min-w-full">
                <!-- 由 JS renderBuyCards 動態生成卡片 -->
              </div>
            </div>
          </div>

          <!-- 建議賣出 (TAKE PROFIT) 橫向卡片滾動區 -->
          <div id="today-sell" class="space-y-4">
            <div id="today-sell-header" class="flex items-center justify-between flex-wrap gap-2">
              <h3 class="text-sm sm:text-base font-bold text-amber-400 m-0 flex items-center gap-2">
                建議賣出 // TAKE PROFIT
              </h3>
              <div class="flex items-center gap-2 shrink-0">
                <span id="today-sell-date-pill"
                  class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/30 font-bold">近5日出場</span>
                <div class="flex items-center gap-1.5 ml-1">
                  <button id="today-sell-prev" type="button" disabled
                    class="carousel-nav-btn is-disabled p-1.5 rounded-xl bg-[#151C24] hover:bg-[#1E2733] active:scale-90 active:bg-amber-500/20 border border-white/10 hover:border-amber-500/40 text-slate-300 hover:text-white transition-all text-xs cursor-pointer flex items-center justify-center w-8 h-8 shadow-sm"
                    title="上一頁 (向左滑動)">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                  </button>
                  <button id="today-sell-next" type="button"
                    class="carousel-nav-btn p-1.5 rounded-xl bg-[#151C24] hover:bg-[#1E2733] active:scale-90 active:bg-amber-500/20 border border-white/10 hover:border-amber-500/40 text-slate-300 hover:text-white transition-all text-xs cursor-pointer flex items-center justify-center w-8 h-8 shadow-sm"
                    title="下一頁 (向右滑動)">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
            <!-- 橫向卡片滾動容器 -->
            <div id="today-sell-scroll-wrapper"
              class="sell-cards-scroll strong-cards-scroll overflow-x-auto pb-2 pt-1 w-full max-w-full">
              <div id="today-sell-cards" class="flex gap-3 sm:gap-4 flex-nowrap w-max min-w-full">
                <!-- 由 JS renderSellCards 動態生成卡片 -->
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <footer id="footer" class="text-center py-6 text-xs text-slate-500 font-mono border-t border-white/5">
        <p>&copy; 2026 JOINJO 股票數據分析平台. All rights reserved.</p>
      </footer>
    </main>
  </div>
</body>

</html>
